# Membuat APK Android My Digit (purwarupa).
# Jalan saat branch "android" atau tag versi di-push, atau manual dari tab Actions.
name: Android

on:
  push:
    branches: [android]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Pasang cargo-apk
        run: cargo install cargo-apk --locked
      - name: Kunci penanda tangan APK
        # Purwarupa: kunci dibuat ulang tiap build, jadi pembaruan perlu
        # uninstall dulu. Untuk rilis resmi, simpan kunci tetap di GitHub Secrets.
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/my-digit.keystore" -alias my-digit \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mydigit -keypass mydigit -dname "CN=My Digit, O=SIDIGIT-23, C=ID"
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/my-digit.keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=mydigit" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          cargo apk build --lib --release
      - uses: actions/upload-artifact@v4
        with:
          name: my-digit-android
          path: target/release/apk/*.apk
          if-no-files-found: error
